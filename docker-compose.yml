services:
  portfolio:
    build: .
    container_name: ssh-portfolio
    restart: unless-stopped
    init: true
    ports:
      # host port 22 is the portfolio; container listens on 2222 internally
      - "22:2222"
    volumes:
      # host key generated per environment, never baked into the image
      - ./keys:/keys:ro
      # sqlite (visitor counter + guestbook) survives rebuilds; the host dir
      # must exist and be owned by uid 1000 BEFORE first start, or Docker
      # creates it root-owned and the bun user crash-loops on EACCES
      - ./data:/app/data
    environment:
      PORT: "2222"
      HOST_KEY_PATH: /keys/host_key
      MAX_SESSIONS: "30"
      DB_PATH: /app/data/portfolio.db
      # Live Spotify readout (the `m` page and the ticker). Stated explicitly
      # even though it is the built-in default, so the kill switch is obvious:
      # set it to "" to disable the feature entirely — the ticker collapses and
      # `m` goes inert.
      # One poller serves every session, and it sleeps while nobody is
      # connected, so this is 3 req/min at most against a 30/min limit.
      NOWPLAYING_URL: https://api.lrnzo.space/v1/now-playing
      # The blog index behind `l`. READ-ONLY: this app only ever issues
      # GET /v1/posts and GET /v1/posts/:slug. Set to "" to disable — `l` opens a page
      # that says the log is offline.
      # Demand-driven rather than polled, cached for 5 minutes, so it costs a
      # couple of requests an hour against a 100/min limit shared by every
      # visitor (they all come from this box's one IP).
      BLOG_URL: https://api.lrnzo.space/v1/posts
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
