services:
  portfolio:
    build: .
    container_name: ssh-portfolio
    restart: unless-stopped
    init: true
    ports:
      # host port 22 is the portfolio; container listens on 2222 internally
      - "22:2222"
    volumes:
      # host key generated per environment, never baked into the image
      - ./keys:/keys:ro
      # sqlite (visitor counter + guestbook) survives rebuilds; the host dir
      # must exist and be owned by uid 1000 BEFORE first start, or Docker
      # creates it root-owned and the bun user crash-loops on EACCES
      - ./data:/app/data
    environment:
      PORT: "2222"
      HOST_KEY_PATH: /keys/host_key
      MAX_SESSIONS: "30"
      DB_PATH: /app/data/portfolio.db
      # Live Spotify readout (the `m` page and the ticker). This is the app's
      # only outbound request. Stated explicitly even though it is the built-in
      # default, so the kill switch is obvious: set it to "" to disable the
      # feature entirely — the ticker collapses and `m` goes inert.
      # One poller serves every session, and it sleeps while nobody is
      # connected, so this is 3 req/min at most against a 30/min limit.
      NOWPLAYING_URL: https://api.lrnzo.space/now-playing
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
