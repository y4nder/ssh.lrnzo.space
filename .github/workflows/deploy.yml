name: test & deploy

on:
  push:
  # Manual kick. `on: push` alone means a run can only ever be created by a
  # commit, so when the Actions service drops a push (2026-08-06: workflow runs
  # failing to start during a critical Actions outage) the merge lands with
  # nothing deployed and no run object to re-run — recovering meant pushing an
  # empty commit. Dispatching on main satisfies the deploy job's ref check, so
  # this redeploys rather than only re-testing.
  workflow_dispatch:

env:
  # Admin sshd host/port/user live in repo secrets, not in the tree —
  # this repo is public, no reason to advertise the deploy door.
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_PORT: ${{ secrets.VPS_PORT }}
  VPS_USER: ${{ secrets.VPS_USER }}
  APP_DIR: /opt/ssh-portfolio

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # pinned host key of the VPS admin sshd (line format: `[host]:port keytype key`)
          echo "[$VPS_HOST]:$VPS_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK9JFFjVBTdJfnEEfSwrS0Q/AY6751+lJoRa9IRyN3m+" >> ~/.ssh/known_hosts

      - name: Sync code
        run: |
          # `data` holds the prod sqlite db — rsync --delete would wipe it
          rsync -az --delete \
            --exclude node_modules --exclude keys --exclude data --exclude .git --exclude .env \
            -e "ssh -p $VPS_PORT" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      - name: Rebuild and restart
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd $APP_DIR && docker compose up -d --build"

      - name: Verify the portfolio answers on port 22
        run: |
          sleep 5
          # ssh2 servers identify only after the client does, so speak first
          banner=$(timeout 10 bash -c 'exec 3<>/dev/tcp/lrnzo.space/22 && printf "SSH-2.0-healthcheck\r\n" >&3 && head -c 32 <&3')
          echo "banner: $banner"
          echo "$banner" | grep -q "SSH-2.0-ssh_portfolio"
